name: Validacao PHP AgroVigia RO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Verificar sintaxe PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
